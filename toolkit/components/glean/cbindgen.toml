header = """/* This Source Code Form is subject to the terms of the Mozilla Public
 * License, v. 2.0. If a copy of the MPL was not distributed with this
 * file, You can obtain one at http://mozilla.org/MPL/2.0/. */
#ifndef mozilla_glean_fog_ffi_generated_h
#define mozilla_glean_fog_ffi_generated_h
"""
trailer = """
#endif // mozilla_glean_fog_ffi_generated_h
"""
autogen_warning = """/* DO NOT MODIFY THIS MANUALLY! This file was generated using cbindgen. */"""
include_version = true
braces = "SameLine"
line_length = 100
tab_width = 2
language = "C++"
namespaces = ["mozilla::glean::impl"]
includes = ["nsTArray.h", "nsString.h", "nsIMemoryReporter.h"]

# Without these cbindgen has no mapping for this crate's target_os cfgs, so it
# emits both branches of fog_init with no #if guard at all and only warns.
[defines]
"target_os = android" = "ANDROID"
"target_os = linux" = "XP_LINUX"
"target_os = macos" = "XP_MACOSX"
"target_os = windows" = "XP_WIN"

[export.rename]
"ThinVec" = "nsTArray"

[parse]
parse_deps = true
include = ["firefox-on-glean"]
extra_bindings = ["firefox-on-glean"]
